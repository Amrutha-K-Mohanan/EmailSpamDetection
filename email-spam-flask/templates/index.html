<!DOCTYPE html>
<html>
<head>
    <title>Email Spam Detection</title>
</head>
<body style="text-align:center; font-family:Arial; margin-top:50px">

    <h1>Email Spam Detection System</h1>

    <form method="POST">
        <textarea name="email" rows="6" cols="60"
                  placeholder="Enter email text here..." required></textarea><br><br>
        <button type="submit">Check Spam</button>
    </form>

    <h2>{{ prediction }}</h2>

</body>
</html>
